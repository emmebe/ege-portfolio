ent world. The well is in a lush meadow, surrounded by woods. There are floating objects like rocks, stones, firefly-like lights, and plants. Mc must now begin solving puzzles and finding their way out of this forest.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Mc has to find a way to survive. MC traverses through the forest out to the planes and then through some farmland in search of help. This happens over various days, in which the MC has a hard time fending for themselves.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• At the end of some farmland, there is a small village. Once in it, mc is greeted by a group of inhabitants- an orc, a walking bore, a witch, and a dwarf. MC faints.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Mc awakens, meets villagers, explains how mc got there and the villagers do their best to explain this world. Mc explores village and uncovers small hints of the history of this world.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• A time-skip shows that this scene was a memory of how mc got to where they are now, reminiscing with the orc, the other bartender.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Thieves begin talking about the magical amulet they wish to acquire, mc ponders out loud to orc if this would help get to home world. Strange traveler makes haughty remark to thieves to deter them, they leave and this traveler comes up to bar. Makes pact with mc to find the amulet after a quick introduction to who the traveler is- now known as Companion.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;-----&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;The mcs arrival/fall into this world disrupts the balance and plane. the demons from the ancient war are alerted on their side of the fabric of space, and the demons and other creatures that remained in this world are also alerted of this new disruption. This makes these foes spike in activity. The inhabitants of this world know of this spike, but don&amp;#39;t know what the cause is. This information isn&amp;#39;t available to the player or characters until later in the game.&amp;amp;nbsp;&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;25\&quot; y=\&quot;1320\&quot; width=\&quot;330\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;omyIxgq5UuBVC0Z8KYb--7\&quot; value=\&quot;• Opens with mc grabbing necessities for trip. prep for adventure in their small apartment above the bar.&amp;amp;nbsp;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Say goodbye to new village friends, embark on journey.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Explore plains, pick up interactables and further relationship with companion- choose to be kind or mean to companion during conversation.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Get to river. The bridge is broken to deter the wispras- the shadow creatures that remained after the first war- from crossing and causing more mischief. Player has to find a way across using logic and puzzles. The river lands are long and wide stretch of various rivers that span from the far west sea to the middle of the continent, which then disperse and span out towards the dunes, mountains, and plains. Some&amp;amp;nbsp; are mild enough to be considered creeks that can be crossed on foot, but the main river is wide and deep with a jagged drop-off on each side, and strong currents, rapids, jagged rocks, and towering stones.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• After crossing, continue exploring. A couple of miles later is the forest, where Moonroot and Whisperbinds are discovered. The mc can collect it to use in the future. This is also the first appearance of wispras where they can be first fought.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Navigate forest using logic and puzzles, collect moonroot and Whisperbinds along the way. The forest varies in density, with some parts allowing easy navigation, others parts having trees so close they&amp;#39;re almost wound together and no sunlight, and some parts with small to medium meadows of open land. The wispras are in the dark areas, and the meadows are where it&amp;#39;s easiest to fight them.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• They enter a new clearing, companion states he thinks the regular trade-route was shut down to stop the wispras from entering the fae land. Mc can choose to trust his judgement or not. They begin to traverse the edge of the forest, now at the bottom of the mountains where they turn into rolling hills and the trees disperse up the mountainside until it&amp;#39;s entirely rock.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• They traverse up the side, and at the edge of the trees, an ambush occurs. the thieves from the prologue attack them. Mc has option to fight or hide, so then the player will either fight or hide until the last thief is down.&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;395\&quot; y=\&quot;1320\&quot; width=\&quot;330\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;omyIxgq5UuBVC0Z8KYb--8\&quot; value=\&quot;• Both decisions yield to the companion saving the mc being snuck up on by the final thief. Mc has option to say something snarky or be thankful.&amp;amp;nbsp;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• The fight moved them up the mountain little by little, closer to the entrance. The normal trade-route cave entrance through the mountains is covered with rubble, an obvious deterrent against the wispras. Companion says the rest of the ways are down and around the mountains, the mc counters and says they should try to find a way through the mountains instead since they&amp;#39;re already there.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Navigate and find new entrance. Find a way through the mountain, use logic to get through it. Navigate the dark cavers, avoid falling rocks, stalactites and stalagmites. Solve puzzles to find new secrets, uncover that demons from the ancient war are also hiding in these mountains. Fight off wispras and demons, figure out how to hide and evade from them.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• This new entrance/cave system is a maze. Explore each hallway and find things written and drawn on the walls- they mean nothing now but allude to how to find the amulet in chapter 4.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Deep into this cave system there is a cavern hugging each side of the cave and so deep the bottom can&amp;#39;t be seen, completely halting travel between. There are calcite bridges hanging above and below the edge and floating stalactites- figure out a way across without alerting the demons behind. Jumping across the stalactites to the far wall and then climbing to the narrow bridge and finishing crossing is how this is solved. The companion goes first to use his travel knowledge to show mc how to cross safely.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Companion finishes crossing first. as mc is crossing the final thinly-formed bridge it begins breaking underneath, mc tries to run across but begins to slip and fall. companion lunges back onto the bridge and catches mc. In this commotion one final straggling demon is sneaking up behind companion. mc saves companion with the option to lose a resource to save him or to try and save him without losing the resource. The woven moonroot can be used as a weapon, if not, then the healing properties of the whisperbinds have to be used anyways to patch the companions wound.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Mc and companion exit the cave. MC stops to say something with the choice to say something nice or mean. When MC exits this part of the cavern.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Companion initiates playful argument w/ mc, which turns to the companion cockily forging ahead heedless of mc&amp;#39;s words. They exit the cavern opening to the cliff edge, which leads to the end of this large mountain and back to the regular trader&amp;#39;s and travelers path. Companion dies from falling rocks outside of the opening, mc is left alone.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;760\&quot; y=\&quot;1320\&quot; width=\&quot;420\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;omyIxgq5UuBVC0Z8KYb--15\&quot; value=\&quot;\&quot; style=\&quot;shape=flexArrow;endArrow=classic;html=1;rounded=0;fontSize=12;startSize=8;endSize=8;curved=1;\&quot; parent=\&quot;1\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry width=\&quot;50\&quot; height=\&quot;50\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;633\&quot; y=\&quot;154.89\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n            &lt;mxPoint x=\&quot;763.5\&quot; y=\&quot;154.99\&quot; as=\&quot;targetPoint\&quot; /&gt;\n            &lt;Array as=\&quot;points\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;omyIxgq5UuBVC0Z8KYb--16\&quot; value=\&quot;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=12;\&quot; parent=\&quot;omyIxgq5UuBVC0Z8KYb--15\&quot; connectable=\&quot;0\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;-0.3965\&quot; y=\&quot;-7\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;-1\&quot; as=\&quot;offset\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;omyIxgq5UuBVC0Z8KYb--17\&quot; value=\&quot;Direction of story\&quot; style=\&quot;text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;633\&quot; y=\&quot;140\&quot; width=\&quot;115\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;IVl9SmhpellF6PVNJpgX-171\&quot; value=\&quot;&amp;lt;font color=&amp;quot;#ff9999&amp;quot;&amp;gt;Final point system&amp;lt;/font&amp;gt;\&quot; style=\&quot;text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;786.09\&quot; y=\&quot;80.56\&quot; width=\&quot;70\&quot; height=\&quot;24.66\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;IVl9SmhpellF6PVNJpgX-173\&quot; value=\&quot;\&quot; style=\&quot;endArrow=none;html=1;rounded=0;exitX=0;exitY=0;exitDx=0;exitDy=0;\&quot; parent=\&quot;1\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry width=\&quot;50\&quot; height=\&quot;50\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;785\&quot; y=\&quot;75.28000000000003\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n            &lt;mxPoint x=\&quot;855\&quot; y=\&quot;75.28\&quot; as=\&quot;targetPoint\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;IVl9SmhpellF6PVNJpgX-174\&quot; value=\&quot;\&quot; style=\&quot;endArrow=none;html=1;rounded=0;exitX=0;exitY=0;exitDx=0;exitDy=0;\&quot; parent=\&quot;1\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry width=\&quot;50\&quot; height=\&quot;50\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;785\&quot; y=\&quot;115.06\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n            &lt;mxPoint x=\&quot;855\&quot; y=\&quot;115.28\&quot; as=\&quot;targetPoint\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;IVl9SmhpellF6PVNJpgX-175\&quot; value=\&quot;\&quot; style=\&quot;endArrow=none;html=1;rounded=0;\&quot; parent=\&quot;1\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry width=\&quot;50\&quot; height=\&quot;50\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;785\&quot; y=\&quot;115\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n            &lt;mxPoint x=\&quot;785\&quot; y=\&quot;75\&quot; as=\&quot;targetPoint\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;IVl9SmhpellF6PVNJpgX-176\&quot; value=\&quot;\&quot; style=\&quot;endArrow=none;html=1;rounded=0;\&quot; parent=\&quot;1\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry width=\&quot;50\&quot; height=\&quot;50\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;855\&quot; y=\&quot;115.28\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n            &lt;mxPoint x=\&quot;854.76\&quot; y=\&quot;74.72\&quot; as=\&quot;targetPoint\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FLxpcI5AvbkyRxnK1lbe-1\&quot; value=\&quot;Chapter 5\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;2161\&quot; y=\&quot;360\&quot; width=\&quot;470\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FLxpcI5AvbkyRxnK1lbe-3\&quot; value=\&quot;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;• Traverse the cliff edge avoiding falling rocks. Find the original path, follow it to the kingdom. Mc ponders if the amulet will even work to get home, if it could be used to save the companion, or if it will even work at all.&amp;lt;/span&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Find fae kingdom alone and explore the new terrain. Can go into shops and trigger small conversations and barks here. Stumble into an old religious building- only a priest is there, kneeling on the stairs.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Priest welcomes mc, wondering &amp;quot;when they would show up.&amp;quot; This prompts a conversation, priest alludes to where the amulet might be- they can &amp;quot;sense&amp;quot; the mc&amp;#39;s not of the land.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Locate the castle in hopes of finding the amulet, interact with some castle staff. Find a way around the guards, sneak into the castle.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Mc gets caught by a royal, who welcomes them in. Something is suspicious- they know the mc&amp;#39;s name already and don&amp;#39;t ask why they&amp;#39;re there, and they don&amp;#39;t exactly meet the expectations of a tall, ethereal fae everyone speaks about- they are boney and slightly withered, with golden eyes. Mc is invited to stay.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Upon getting into their guest room, mc looks for ways out. The main door is locked, search for ways to exit- the moonroot in the travel pack begins to glow while approaching a nightstand.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Open the passage, explore the maze of forgotten, cobblestone halls in the basement. Somewhere deep in the maze, the grating noise of the passage re-opening happens behind mc, and suddenly everything is still and unsettling- something dark is following.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Escape in the dark, find a way out. Locate the next secret passage- one of the previous &amp;quot;meaningless&amp;quot;&amp;amp;nbsp;riddles alluded to a door-knocking lantern. Knock one of the ancient lanterns against the wall and open the passage and close it behind.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; Continue exploring deep in the castle&amp;amp;nbsp; further down the stairs there&amp;#39;s aqueducts. One end is blocked by bars, the other is open and dark. Mc follows the path down this ancient tunnel, the water drops off suddenly and stairs appear to the side. This large opening is an ancient spiritual space built by bones of people from the old world. Explore the space, solve a puzzle to get into the secret passage under the alter.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• The catacombs are located below, mc follows the passage and locates the tombs of the ancient king and queen. The back of the catacomb lay mounds of their treasures- old coins, armor for each of them, weapons, and other jewels and treasures. Interacting with the treasure triggers the specter of the queen to emerge.&amp;amp;nbsp;&amp;lt;br&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1211.56\&quot; y=\&quot;1320\&quot; width=\&quot;458.44\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FLxpcI5AvbkyRxnK1lbe-4\&quot; value=\&quot;Chapter 5\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;2190\&quot; y=\&quot;1230\&quot; width=\&quot;470\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FLxpcI5AvbkyRxnK1lbe-5\&quot; value=\&quot;&amp;lt;div&amp;gt;• The queen shows clips of the ancient war and alludes to the power of the amulet- how she revived her king and kept him alive much longer than his human years permitted, but could also open a rip in space. This knowledge can be used later. The amulet isn&amp;#39;t here, the legend was a lie to offset disaster that would come if it were to actually be found. Her specter is on borrowed time and is cut off before anything else can be explained, she says to choose between the sword and a gifted lantern as she fades out.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; Choose one of the ancient artifacts- a sword or a lantern, embark on the journey back to find the actual amulet.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;•&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp;&amp;lt;/span&amp;gt;S&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;neak out of the castle a different route, mc has to sneak out of kingdom hiding from anyone to protect their magical artifact of choice from being discovered. Fight or evade enemies nearing the mountain- some nasty thieves that have the same golden eyes as the suspicious &amp;quot;royal&amp;quot; in the castle.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;• B&amp;lt;/span&amp;gt;acktrack to mountain, the last choice affects path into the cavern - one makes it an easy in and hard out, one makes it a hard in and easy out. The sword&amp;#39;s power alerts the other magical enemies inside while entering the cavern and mc has to go through them to get to the bottom, but exiting is easier- regular paths can be taken because the sword gifts strength and is made of Haraban Steel (virtually unbreakable). The lantern is a collection of full-moon light magic, which allows the moonroot to solidify so it can be used to get down outside of enemy perception- but the player has to evade enemies on the way out..&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;•&amp;amp;nbsp;&amp;lt;/span&amp;gt;Use sword to fight and climb down the cavern or the lantern to illuminate the moonroot to get down.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;• U&amp;lt;/span&amp;gt;se past hints and logic to find hidden opening, crawl between the stalagmites then through the dark passage.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Locate the old alchemic room of the ancient magic wielders. Solve a puzzle on the floor tiles to open up the center tile where the amulet is.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;•&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp; Solve more puzzles to explore the hidden compartments, obtain information on the unwritten history of the war and ancient magic that was stolen then hidden because of its power. Find the book of spells.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;•&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp;&amp;amp;nbsp;&amp;lt;/span&amp;gt;This mass-magical disturbance causes the whole cavern to begin shaking and crumbling. Escape the cavern with all of the artifacts.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;•&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp; T&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;he collapse changes the maze, figure out how to get out. Exit the mountain and attempt to locate the initial path taken with the companion.&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;1699.78\&quot; y=\&quot;1320\&quot; width=\&quot;458.44\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FLxpcI5AvbkyRxnK1lbe-6\&quot; value=\&quot;•&amp;amp;nbsp; Traverse the old paths. In one of the nearest clearings, mc stops to use the spellbook. Solve puzzles in the book to obtain new magical skills. This magic drains the wielder.&amp;amp;nbsp;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Demons similar to those in the queen&amp;#39;s flashback begin to appear out of nowhere, combat them with the spells and evade.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; Retrace steps back to the village, use this &amp;quot;new&amp;quot; old magic to get back more smoothly. Solve more puzzles to obtain more magical knowledge, fixing pathways (including the bridge over the rivers) to get back.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;• Battle and evade continuously-spawning enemies. Get back to the village, which is now in shambles.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; Most of the village is in shambles, the villagers milling about trying to recover those trapped under the rubble, others gathering resources, the rest putting the tavern - the least damaged building- back together as a safe-haven until the village is rebuilt.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; Explain to the villagers and old friends what happened and that a war is coming- the rip the reader caused in this world has alerted the demons of the past. Use magic to help assist rebuilding the tavern.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; Mill about the village, mc ponders what their decision should be. Teach the villagers how to use the magic, learn that the strength of this learned magic depends on the beholder- anyone can learn it, but mc has a strength unmatched by the villagers thus far.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; The war is approaching and droves of enemies are pouring into the world. Mc&amp;#39;s old friends come and warn her to make her decision, some drilling mc to escape home, others begging to help.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;•&amp;amp;nbsp; A small army of demons attacks the village, battle them with the villagers. Solve puzzles to outsmart the stronger generals, physically battle the smaller ranking ones. Help the non-magic wielding villagers escape.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;•&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp; At the end, many are dead.&amp;amp;nbsp;&amp;lt;/span&amp;gt;Make a decision to use the amulet to save the companion and stay in this world, or risk using it to escape home.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=top;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;2195.78\&quot; y=\&quot;1310\&quot; width=\&quot;458.44\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;N6zKjuEtEMlmODAJY-Dz-1\&quot; value=\&quot;Endings\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;2690\&quot; y=\&quot;1230\&quot; width=\&quot;700\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;N6zKjuEtEMlmODAJY-Dz-3\&quot; value=\&quot;&amp;lt;div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font color=&amp;quot;#82b366&amp;quot;&amp;gt;Choose to go home - the not-great decision:&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Really Bad Ending -- -&amp;lt;font color=&amp;quot;#ff9999&amp;quot;&amp;gt;3 - 1 points&amp;lt;/font&amp;gt;:&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;/span&amp;gt;The player&amp;#39;s points land in the lower portion.&amp;amp;nbsp;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The amulet decides the player is undeserving of the power. They must remain in this world, &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;and live knowing they could have saved&amp;amp;nbsp; the&amp;amp;nbsp; companion. The war comes, MC is barely &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;welcome anymore.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Demons come to the village again, but this time the villagers do not support the mc. The &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;amulet is also no longer supporting their power, mc&amp;#39;s choices until nowhave not proven &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;their worth to the amulet.&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Player dies fighting a demon.&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Okay Ending -- &amp;lt;font color=&amp;quot;#ff9999&amp;quot;&amp;gt;2 - 6 points&amp;lt;/font&amp;gt;:&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The player&amp;#39;s points land in the upper portion.&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The amulet accepts sending the player home, but before falling through the rip, an army &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;bearing the crests of the Southern Fae and the Fae of&amp;amp;nbsp; Phylon (the&amp;amp;nbsp;elder fae from the &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;homeland) arrive over the hills. There is hope.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Upon return, the MC wakes up in a hospital, home, but greatly injured from whatever accident &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;made them fall through the portal in the first place.&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font color=&amp;quot;#82b366&amp;quot;&amp;gt;Choose to revive the companion - the good decision:&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Decent Ending -- &amp;lt;font color=&amp;quot;#ff9999&amp;quot;&amp;gt;-3 - 1 points&amp;lt;/font&amp;gt;:&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The player&amp;#39;s points land in the lower portion.&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The amulet works and the companion is revived.&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The war is still coming.&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;MC up until this point has, until this point, proven to make not-good decisions, the amulet &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;does not improve mc&amp;#39;s power any further. There is little hope, but everyone is, at least, &amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;together and happy.&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Really Good Ending -- &amp;lt;font color=&amp;quot;#ff9999&amp;quot;&amp;gt;2 - 6 points&amp;lt;/font&amp;gt;:&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;Player&amp;#39;s points are in the upper portion.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;The amulet revives the companion after mc retrieves the body with a scouting party. Mc&amp;#39;s &amp;lt;span style=&amp;quot;white-space: pr
